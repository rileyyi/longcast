<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>longcast</title>
<meta name="description" content="A 35-day weather outlook for any place, pooled from open forecast models and set against 30 years of local climate.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' fill='black'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@100..700&display=swap" rel="stylesheet">
<style>
:root{
  --s:12px;--m:14px;--l:20px;--xl:36px;--xxl:48px;
  --dcols:6.5ch 6ch 3.5ch minmax(48px,1fr) 3.5ch 6ch 4ch;
  --wcols:6ch 6ch minmax(96px,1fr) 8ch 7ch 9ch;
  --paper:#ffffff;
  --ink:#000000;
  --ink-2:color-mix(in srgb,var(--ink) 88%,var(--paper));
  --ink-3:color-mix(in srgb,var(--ink) 72%,var(--paper));
  --rule:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --track:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --norm:color-mix(in srgb,var(--ink) 22%,var(--paper));
  --wash:color-mix(in srgb,var(--ink) 4%,var(--paper));
  --rule-fixed:color-mix(in srgb,var(--ink) 24%,var(--paper));
  --hover:color-mix(in srgb,var(--ink) 7%,var(--paper));
  --mono:"M PLUS 1 Code", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;
  background:var(--paper);color:var(--ink);
  font:var(--base-weight,400) var(--m)/1.6 var(--mono);
  font-variant-numeric:tabular-nums;
